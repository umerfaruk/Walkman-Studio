[package]
name = "walkman-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UI layer for Walkman Studio: iced design system, reusable widgets, views, and sheets."

[dependencies]
walkman-domain = { workspace = true }
walkman-services = { workspace = true }
walkman-platform = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

# GUI toolkit (decision recorded in design.md's egui/eframe choice, superseded by the
# egui-to-iced migration plan once the iced shell reached parity — Milestone 8).
iced = { version = "0.13", default-features = false, features = ["wgpu", "tokio", "canvas", "image", "svg"] }
